<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rugby Manager</title>
<style>
:root{--bg:#0f1720;--panel:#17212c;--panel2:#1d2a38;--line:#2a3a4c;--txt:#e6edf3;--mut:#8b9bb0;--acc:#2ea96b;--acc2:#e0b341;--bad:#e5534b;--blue:#4c9be8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
h1,h2,h3{margin:0 0 10px}
h2{font-size:18px}h3{font-size:15px;color:var(--acc2)}
button,select{font:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
input[type=number]{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:4px 6px;max-width:100%}
#top{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top .logo{font-weight:800;font-size:17px;color:var(--acc)}
#top .sp{flex:1}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 12px;color:var(--mut)}
.pill b{color:var(--txt)}
#wrap{display:flex;min-height:calc(100vh - 52px)}
#nav{width:170px;background:var(--panel);border-right:1px solid var(--line);padding:10px 0;flex-shrink:0}
#nav a{display:block;padding:10px 18px;color:var(--mut);cursor:pointer}
#nav a:hover{background:var(--panel2);color:var(--txt)}
#nav a.on{background:var(--panel2);color:var(--txt);border-left:3px solid var(--acc)}
#main{flex:1;padding:18px;overflow-x:auto;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
tr.me td{background:rgba(46,169,107,.14)}
tr.q td:first-child{border-left:3px solid var(--acc2)}
td.n,th.n{text-align:right}
.mut{color:var(--mut)}
.ok{color:var(--acc)}.ko{color:var(--bad)}.warn{color:var(--acc2)}
.o1{color:#3ddc84}.o2{color:#a6d63c}.o3{color:#e0b341}.o4{color:#e8833a}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vs{display:flex;align-items:center;justify-content:center;gap:24px;font-size:20px;font-weight:700;margin:6px 0 12px;text-align:center}
.vs small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.score{font-size:34px;font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:10}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:100%;max-width:760px}
.ev{display:flex;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.ev .m{width:36px;color:var(--mut);text-align:right;flex-shrink:0}
.ev.try{color:var(--acc)}.ev.card{color:var(--acc2)}.ev.half{color:var(--blue);font-weight:600}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.clubs .c{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}
.clubs .c:hover{border-color:var(--acc)}
.center{max-width:900px;margin:30px auto;padding:0 14px}
p{margin:6px 0}
.help li{margin:4px 0}
@media(max-width:700px){#wrap{flex-direction:column}#nav{width:auto;display:flex;overflow-x:auto;border-right:0}#nav a{white-space:nowrap}}
</style>
</head>

function effAt(p,slot){
  const ok=slot[3].includes(p.g);
  const fit=ok?(slot[4]&&p.sub&&p.sub!==slot[4]?.94:1):(NEIGH[slot[1]].includes(p.g)?.9:.72);

// Composition : on place d'abord chaque joueur à son poste naturel (titulaires puis banc),
// et on ne met quelqu'un hors de son poste que s'il n'y a plus personne de disponible à ce poste.
function fillSlots(club,out,used){
  const avail=club.squad.filter(p=>p.inj===0&&!used.has(p.id));
  for(const natural of [true,false]){
    for(let i=0;i<23;i++){
      if(out[i])continue;
      let best=null,bv=-1;
      for(const p of avail){
        if(used.has(p.id))continue;
        if(natural&&!SLOTS[i][3].includes(p.g))continue;
        const v=effAt(p,SLOTS[i]);if(v>bv){bv=v;best=p}
      }
      if(best){out[i]=best.id;used.add(best.id)}
    }
  }
  return out;
}
function autoLineup(club){return fillSlots(club,Array(23).fill(null),new Set())}
function fixLineup(club){
  const byId=id=>club.squad.find(p=>p.id===id);
  const used=new Set();
  const out=club.lineup.map(id=>{const p=byId(id);if(p&&p.inj===0&&!used.has(id)){used.add(id);return id}return null});
  club.lineup=fillSlots(club,out,used);
}
function teamCalc(club){
  const L=club.lineup.map((id,i)=>{const p=club.squad.find(x=>x.id===id);return{p,i,v:p?effAt(p,SLOTS[i]):40}});
  const avg=(a,b)=>{let s=0;for(let i=a;i<=b;i++)s+=L[i].v;return s/(b-a+1)};
  const ks=[8,9,14].map(i=>L[i]).filter(x=>x.p);
  let kp=ks.length?ks.reduce((a,b)=>b.p.but>a.p.but?b:a).p:null;
  let men=0,n=0;for(let i=0;i<15;i++)if(L[i].p){men+=to99((L[i].p.sfr+L[i].p.dec)/2);n++}
  return{L,pack:avg(0,7),backs:avg(8,14),bench:avg(15,22),kick:kp?to99((kp.but*2+kp.pie)/3):50,kickerP:kp,men:n?men/n:50};
}

function mkFixtures(ids){
  const n=ids.length,arr=[...ids],rounds=[];
  for(let r=0;r<n-1;r++){
    const m=[];
    for(let i=0;i<n/2;i++){let a=arr[i],b=arr[n-1-i];if((r+i)%2)[a,b]=[b,a];m.push([a,b])}
    rounds.push(m);arr.splice(1,0,arr.pop());
  }
  return rounds.concat(rounds.map(m=>m.map(([a,b])=>[b,a])));
}

// ---- Simulation d'un match ----
function simMatch(hc,ac,opt={}){
  const clubs=[hc,ac],T=[teamCalc(hc),teamCalc(ac)];
  const sc=[0,0],tr=[0,0],pn=[0,0],dr=[0,0],cv=[0,0],yc=[0,0],seq=[0,0],ycT=[0,0];
  const ev=[],hb=opt.neutral?0:2.5;
  const sty=i=>STY[clubs[i].tac.style],ib=i=>({basse:-2,normale:0,haute:2})[clubs[i].tac.int];
  const rating=(i,min)=>{
    const t=T[i];let pk=t.pack+ib(i),bk=t.backs+ib(i);
    if(min>55){pk=pk*.78+t.bench*.22;bk=bk*.78+t.bench*.22}
    const f=ycT[i]>0?.93:1,h=i===0?hb:0;
    return{pk:pk*f+h,bk:bk*f+h,kick:t.kick};
  };
  const nm=i=>clubs[i].short;
  const SW=[1,2,1,1,1,2,2,3,2,2,6,4,4,6,4];
  const pickScorer=(i,min)=>{
    const t=T[i],S=sty(i);
    if(min>60&&R.f()<.25){const b=t.L.slice(15).filter(x=>x.p);if(b.length)return R.pick(b).p}
    const ws=SW.map((w,k)=>w*(S===STY.conquete&&k<8?1.8:S===STY.mouvement&&k>=8?1.3:1)*(t.L[k].p?1:0));
    let tot=ws.reduce((a,b)=>a+b,0),r=R.f()*tot;
    for(let k=0;k<15;k++){r-=ws[k];if(r<=0)return t.L[k].p}
    return t.L[14].p||t.L[0].p;
  };
  const push=(min,i,k,x)=>ev.push({m:min,ti:i,k,x:`${x}`+(k==='try'||k==='conv'||k==='pen'||k==='drop'?`  (${sc[0]}-${sc[1]})`:'')});
  for(let min=1;min<=80;min++){
    if(min===41)ev.push({m:40,ti:-1,k:'half',x:`Mi-temps : ${hc.short} ${sc[0]} - ${sc[1]} ${ac.short}`});
    for(const i of[0,1])if(ycT[i]>0)ycT[i]--;
    const rr=[rating(0,min),rating(1,min)];
    const pos=i=>.55*rr[i].pk+.45*rr[i].bk;
    const pH=clamp(.5+(pos(0)-pos(1))/160,.36,.64);
    const a=R.f()<pH?0:1,d=1-a;
    if(R.f()<.011){
      const i=R.f()<.5?0:1;
      if(ycT[i]===0){ycT[i]=10;yc[i]++;const p=T[i].L[R.i(0,14)].p;if(p)push(min,i,'card',`Carton jaune pour ${p.name} (${nm(i)}). ${nm(i)} à 14 pendant 10 minutes.`)}
    }
    seq[a]++;
    const S=sty(a),sw=S.wp+S.wb+S.wk;
    const att=(S.wp*rr[a].pk+S.wb*rr[a].bk+S.wk*rr[a].kick)/sw;
    const def=.5*rr[d].pk+.5*rr[d].bk;
    const r=clamp(Math.exp((att-def)/14),.45,2.4);
    const disc=clamp(1+(70-T[d].men)/120,.8,1.25);
    const pTry=.066*r*S.try,pPen=.058*S.pen*disc*Math.pow(r,.3),pDrop=.004*S.drop*Math.pow(r,.3);
    const u=R.f();
    const kp=T[a].kickerP,kprob=kp?clamp(.55+(to99(kp.but)-60)/110,.35,.95):.5;
    if(u<pTry){
      const p=pickScorer(a,min);sc[a]+=5;tr[a]++;
      if(p){p.st.es++;p.st.pts+=5}
      push(min,a,'try',`ESSAI ${nm(a)} ! ${p?p.name:'?'} aplatit.`);
      if(R.f()<kprob){sc[a]+=2;cv[a]++;if(kp){kp.st.pts+=2}push(min,a,'conv',`Transformation réussie par ${kp?kp.name:'?'}.`)}
      else push(min,a,'miss',`Transformation manquée (${kp?kp.name:'?'}).`);
    }else if(u<pTry+pPen){
      if(R.f()<.85){
        if(R.f()<kprob+.1){sc[a]+=3;pn[a]++;if(kp)kp.st.pts+=3;push(min,a,'pen',`Pénalité réussie pour ${nm(a)} (${kp?kp.name:'?'}).`)}
        else push(min,a,'miss',`Pénalité manquée par ${kp?kp.name:'?'} (${nm(a)}).`);
      }
    }else if(u<pTry+pPen+pDrop){
      if(R.f()<.45){sc[a]+=3;dr[a]++;if(kp)kp.st.pts+=3;push(min,a,'drop',`Drop réussi par ${kp?kp.name:'?'} (${nm(a)}) !`)}
    }
  }
  let winner=sc[0]>sc[1]?hc.id:sc[1]>sc[0]?ac.id:null;
  if(!winner&&opt.ko){
    const w=R.f()<.5+(clubStr(hc)-clubStr(ac))/100?0:1;sc[w]+=3;
    winner=clubs[w].id;ev.push({m:80,ti:w,k:'pen',x:`Prolongation : ${nm(w)} s'impose sur le fil !`});
  }
  // Règles LNR (Top 14 / Pro D2) : bonus offensif = au moins 3 essais de plus que l'adversaire, bonus défensif = défaite de 5 points ou moins
  const bh=(tr[0]-tr[1]>=3?1:0)+(sc[0]<sc[1]&&sc[1]-sc[0]<=5?1:0);
  const ba=(tr[1]-tr[0]>=3?1:0)+(sc[1]<sc[0]&&sc[0]-sc[1]<=5?1:0);
  return{sh:sc[0],sa:sc[1],th:tr[0],ta:tr[1],ph:Math.round(seq[0]/(seq[0]+seq[1])*100),pn,dr,cv,yc,ev,bo:[bh,ba],winner};
}
function updateTable(lg,r){
  const T=G.L[lg].table,h=T[r.h],a=T[r.a];
  h.j++;a.j++;h.pf+=r.sh;h.pa+=r.sa;a.pf+=r.sa;a.pa+=r.sh;
  if(r.sh>r.sa){h.g++;a.p++;h.pts+=4}else if(r.sh<r.sa){a.g++;h.p++;a.pts+=4}else{h.n++;a.n++;h.pts+=2;a.pts+=2}
  h.bo+=r.bo[0];a.bo+=r.bo[1];h.pts+=r.bo[0];a.pts+=r.bo[1];
}
const sortedTable=lg=>Object.values(G.L[lg||ME().lg].table).sort((x,y)=>y.pts-x.pts||(y.pf-y.pa)-(x.pf-x.pa)||y.pf-x.pf);

const involves=(f,id)=>f.h===id||f.a===id;
function nextMatchOf(m){
  if(G.phase==='access')return (G.access||[]).find(f=>involves(f,m.id))||null;
  if(G.phase!=='season')return null;
  const L=G.L[m.lg];if(!L)return null;
  if(L.phase==='regular'){const f=L.fixtures[L.week].find(x=>x[0]===m.id||x[1]===m.id);return f?{h:f[0],a:f[1]}:null}
  if(L.phase==='playoffs')return L.po.next.find(f=>involves(f,m.id))||null;
  return null;
}

}
const slimR=r=>({h:r.h,a:r.a,sh:r.sh,sa:r.sa,th:r.th,ta:r.ta,bo:r.bo,winner:r.winner});
function playFixtures(fx,ko){
  const out=[];
  for(const f of fx){
    const hc=C(f.h),ac=C(f.a);
    const r=simMatch(hc,ac,{ko,neutral:f.neutral});r.h=f.h;r.a=f.a;
    afterMatch(hc);afterMatch(ac);
    out.push(r);
  }
  return out;
}
// Joue une étape (journée ou tour de phase finale) d'un championnat
function stepLeague(lg){
  const L=G.L[lg],m=ME();
  if(L.phase==='done')return null;
  const ko=L.phase==='playoffs';
  const fx=ko?L.po.next:L.fixtures[L.week].map(x=>({h:x[0],a:x[1]}));
  const out=playFixtures(fx,ko);
  if(!ko)out.forEach(r=>updateTable(lg,r));
  const slim=out.map(slimR);
  if(!ko)L.results[L.week]=slim;else L.po.res.push({stage:L.po.stage,m:slim});
  const mine=out.find(r=>involves(r,m.id))||null;
  if(mine){mine.others=slim;mine.ko=ko}
  if(!ko){
    L.week++;
    if(L.week===LEAGUES[lg].rounds){
      const seeds=sortedTable(lg).slice(0,6).map(r=>r.id);
      L.po={stage:0,seeds,next:[{h:seeds[2],a:seeds[5]},{h:seeds[3],a:seeds[4]}],res:[],champ:null,fin:null};
      L.phase='playoffs';
      if(lg===m.lg)addNews(`Fin de la phase régulière de ${LEAGUES[lg].name}. Qualifiés : ${seeds.map(id=>C(id).short).join(', ')}.`);
    }
  }else{
    const po=L.po,w=out.map(r=>r.winner);
    if(po.stage===0){po.next=[{h:po.seeds[0],a:w[1]},{h:po.seeds[1],a:w[0]}];po.stage=1}
    else if(po.stage===1){po.next=[{h:w[0],a:w[1],neutral:true}];po.stage=2}
    else{po.champ=w[0];po.fin=out[0].h===w[0]?out[0].a:out[0].h;L.phase='done';po.next=[];
      addNews(`🏆 ${C(po.champ).name} remporte le ${LEAGUES[lg].name} !`)}
  }
  return mine;
}
// Bouton "Jouer" : joue l'étape, puis avance automatiquement tant que le club du joueur n'a pas de match

// Masse salariale maximale : salary cap en Top 14 ; en Pro D2 le cap légal est le même mais c'est le budget qui limite (25 % du budget)
function capOf(c){if(c.lg==='t14')return c.cap||CAP_BASE;if(c.lg==='pd2')return Math.min(CAP_BASE,Math.round((c.bud||9000)*.25));return Math.round((c.bud||2500)*.2)}
// Salaire annuel brut (k€) d'un joueur de Top 14 selon sa note (calé sur Midi Olympique : moyenne ~260 k€, stars 480-600 k€+, espoirs < 60 k€)
const SALTAB=[[40,10],[45,15],[50,25],[55,40],[60,65],[65,110],[70,175],[75,250],[80,340],[85,450],[90,560],[95,720],[99,850]];
function interp(t,x){if(x<=t[0][0])return t[0][1];for(let i=1;i<t.length;i++)if(x<=t[i][0]){const[a,b]=t[i-1],[c,d]=t[i];return b+(d-b)*(x-a)/(c-a)}return t[t.length-1][1]}
const LGSAL={t14:1,pd2:.45,nat:.12};
function salaryFor(o,age,lg){const ak=age<=20?.4:age<=21?.5:age<=22?.65:age<=23?.82:age>=34?.8:age>=32?.9:1;return Math.max(8,Math.round(interp(SALTAB,o)*(LGSAL[lg]||.3)*ak))}
// Valeur marchande (k€) : note, âge, marge de progression
function valueOf(p){
  const o=ovr(p),ak=p.age<=21?1.6:p.age<=23?1.35:p.age<=27?1.1:p.age<=30?.8:p.age<=32?.5:.25;
  const pk=p.age<=24?1+Math.max(0,(p.pot||o)-o)/25:1;
  return Math.max(10,Math.round(interp(SALTAB,o)*1.6*ak*pk/10)*10);
}
const STARTERS={PIL:2,TAL:1,'2L':2,'3L':3,DM:1,OUV:1,CEN:2,AIL:2,ARR:1};
function depthRank(p,club){return club.squad.filter(x=>x.g===p.g&&x.id!==p.id&&ovr(x)>ovr(p)).length}
// Indemnité demandée par le club vendeur
function askFee(p,club){
  if(!club||p.ctr<=0)return 0;
  const rk=[...club.squad].sort((a,b)=>ovr(b)-ovr(a)).indexOf(p);
  const imp=rk<5?1.6:rk<15?1.25:.9;
  const short=club.squad.filter(x=>x.g===p.g).length<=MINCOMP[p.g]?1.8:1;
  return Math.round(valueOf(p)*Math.min(p.ctr,3)/2*imp*short/10)*10;
}
// Salaire exigé par le joueur pour signer dans un club
function wageDemand(p,club,mode){
  const o=ovr(p);let d=salaryFor(o,p.age,club.lg);
  const wouldStart=club.squad.filter(x=>x.g===p.g&&x.id!==p.id&&ovr(x)>o).length<STARTERS[p.g];
  d*=wouldStart?.95:1.12;
  const cur=findPlayer(p.id).club;
  if(mode!=='renew'&&cur&&cur.lg==='t14'&&club.lg!=='t14')d*=1.2;
  d=Math.max(d,p.sal*(mode==='renew'?1:1.05));
  return Math.round(d/5)*5;
}

}

// pot = potentiel (note maximale atteignable), pro = professionnalisme caché (1-20) qui accélère la progression
function buildAttrs(p,g,o,noise,mods){
  const T=to20(o);
  // attributs hors poste (mêlée d'un demi de mêlée, buteur d'un pilier…) : bas et peu liés au niveau général
  for(const [k] of ATTRS){const pr=PROF[g][k]??-2;let v=(pr<=-6?T*.5+pr*.6:T+pr)+noise(k);if(mods&&mods[k])v+=mods[k];p[k]=v}
  for(let it=0;it<6;it++){const d=T-to20(ovrAt(p,g));for(const k in W[g])p[k]+=d;for(const [k] of ATTRS)p[k]=clamp(p[k],1,20)}
}
function initPot(o,age,h){const g=age<=19?14+h*14:age<=21?8+h*12:age<=23?4+h*9:age<=25?1+h*5:age<=28?h*2.5:0;return Math.round(Math.min(99,o+g))}
function genPlayer(g,level,age){
  age=age||clamp(Math.round(R.n(26,4)),19,36);
  const p={id:G.nid++,name:genName(),g,age,forme:90,inj:0,ni:false,ctr:R.i(1,4),st:{mj:0,tit:0,es:0,pts:0},sub:g==='PIL'?R.pick(['LH','TH']):g,pro:R.i(4,18),hist:[]};
  buildAttrs(p,g,clamp(level,30,95),()=>R.n(0,1.3));
  const o=ovrAt(p,g);
  p.pot=initPot(o,age,R.f());
  p.sal=salaryFor(o,age,'pd2');
  return p;
}
function realPlayer(r,lg){
  const [n,g,sub,by,nat,caps,rec,rt,tags,ev,str,weak]=r,age=2026-by;
  const o=clamp(rt,45,97);
  const p={id:G.nid++,name:n,g,age,forme:90,inj:0,ni:false,ctr:R.i(1,4),st:{mj:0,tit:0,es:0,pts:0},real:true,nat,sub,tags,caps,ev,hist:[]};
  const mods={};
  for(const t of tags)if(TAGMOD[t])for(const k in TAGMOD[t])mods[k]=(mods[k]||0)+TAGMOD[t][k];
  for(const k of (str||'').split(',').filter(Boolean))mods[k]=(mods[k]||0)+3;
  for(const k of (weak||'').split(',').filter(Boolean))mods[k]=(mods[k]||0)-3;
  buildAttrs(p,g,o,k=>(hashN(n+k)-.5)*2.6,mods);
  const ov=ovrAt(p,g);
  p.pro=clamp(Math.round(5+hashN(n+'pro')*12+(tags.includes('w')?2:0)+(rec?1:0)),1,20);
  p.pot=initPot(ov,age,hashN(n+'pot'));
  p.sal=Math.round(salaryFor(ov,age,lg)*(.88+hashN(n+'sal')*.24));
  return p;
}
function realSquad(id,str,lg){

function genSquad(str,lg){const s=[];for(const g in COMP)for(let i=0;i<COMP[g];i++){const p=genPlayer(g,str-i*3.2+R.n(0,3));p.sal=salaryFor(ovr(p),p.age,lg||'nat');s.push(p)}return s}
function mkClub(c,lg){

  const cl={id:c[0],name:c[1],short:c[2],str:c[3],lg,bud:info.bud,cap:info.cap,sponsor:0,squad:REAL[c[0]]?realSquad(c[0],c[3],lg):genSquad(c[3],lg),tac:{style:'equilibre',int:'normale'},focus:'equilibre',budget:0,lineup:[],mp:0};
  // ajuste la masse salariale pour qu'elle respecte le plafond (et soit proche du cap en Top 14)

function afterMatch(club){

  club.mp=(club.mp||0)+1;

    const st=i<15;p.st.mj++;if(st)p.st.tit=(p.st.tit||0)+1;p.forme=clamp(p.forme-(st?cost:cost*.4),20,100);
    if(R.f()<.04*(st?1:.4)*ik){const w=R.pick([1,1,2,2,3,4,6,8,12]);p.inj=Math.max(3,w*7+R.i(-2,2));p.ni=true;p.forme=Math.min(p.forme,60);if(club.id===G.meId){const t=R.pick(w<=2?['contracture aux ischio-jambiers','entorse de la cheville','commotion cérébrale (protocole)','béquille à la cuisse']:w<=6?['entorse du genou','déchirure musculaire','lésion à l\'épaule','fracture du nez']:['rupture des ligaments','fracture de la main','luxation de l\'épaule','lésion du tendon d\'Achille']);addNews(`Blessure : ${p.name} (${posL(p)}) est absent ${injDur(p.inj)}.`);mail('Staff médical',`Blessure : ${p.name}`,`${p.name} (${posL(p)}) souffre d'une ${t}. Durée d'indisponibilité estimée : <b>${injDur(p.inj)}</b>.`,{act:{tab:'squad'}})}}

const playShare=(p,c)=>c&&c.mp?Math.min(1,((p.st.tit||0)+.4*(p.st.mj-(p.st.tit||0)))/c.mp):0;
// Progression hebdomadaire : âge, écart au potentiel, temps de jeu, professionnalisme, niveau du championnat

    p.ctr=0;p.faT=0;p.sal=salaryFor(ovr(p),p.age,'pd2');G.fa.push(p);

function removeFromClub(p,club){club.squad=club.squad.filter(x=>x.id!==p.id);club.lineup=club.lineup.map(id=>id===p.id?null:id)}
function tlog(t){G.tlog=G.tlog||[];G.tlog.unshift(`${seasonLabel()} · ${t}`);if(G.tlog.length>80)G.tlog.length=80}
// Transfert effectif d'un joueur vers un club (from = null pour un joueur libre)
function doTransfer(p,from,to,fee,sal,yrs){
  if(from)removeFromClub(p,from);else G.fa=G.fa.filter(x=>x.id!==p.id);
  p.sal=sal;p.ctr=yrs;p.list=false;if(G.phase==='offseason')p.fresh=true;p.forme=Math.min(p.forme,85);delete p.faT;
  to.squad.push(p);
  if(from&&from.id===G.meId){from.budget+=fee;G.fin.transfers+=fee}
  if(to.id===G.meId){to.budget-=fee;G.fin.transfers-=fee}
  else if(from)from.budget=(from.budget||0)+fee;
  const txt=`${p.name} (${posL(p)}, ${Math.round(ovr(p))}) : ${from?from.short:'libre'} → ${to.short}${fee?` pour ${fmtK(fee)}`:''}`;
  tlog(txt);
  if(to.id===G.meId||(from&&from.id===G.meId)||ovr(p)>=76)addNews('Mercato : '+txt);
}
const fmtK=n=>Math.abs(n)>=1000?(n/1000).toFixed(2).replace('.',',')+' M€':Math.round(n)+' k€';
// Évaluation d'une offre du joueur (pre = pré-contrat gratuit pour un joueur en dernière année)
function evalOffer(p,from,fee,sal,yrs,pre){
  const m=ME();
  if(!yrs||yrs<1||yrs>5)return{msg:'Durée de contrat : entre 1 et 5 ans.'};
  if(m.squad.length>=50&&!pre)return{msg:'Effectif complet (50 joueurs maximum).'};
  if(!pre&&mass(m)+sal>capOf(m))return{msg:`Plafond salarial dépassé : il te reste ${fmtK(Math.max(0,capOf(m)-mass(m)))} de marge.`};
  if(from&&!pre){
    if(!windowOpen())return{msg:'La fenêtre de transferts est fermée (ouverte à l\'intersaison et de la 10e à la 13e journée). Seuls les joueurs libres et les pré-contrats sont possibles.'};
    if(fee>m.budget)return{msg:`Trésorerie insuffisante (${fmtK(m.budget)}).`};
    const ask=askFee(p,from);
    if(fee<ask)return{club:`${from.short} refuse ton offre. Il faudrait environ ${fmtK(ask)}.`,counter:ask};
  }
  const dem=wageDemand(p,m,pre?'pre':'move');
  const cur=from;
  if(cur&&cur.lg==='t14'&&m.lg==='pd2'&&ovr(p)>=80&&sal<dem*1.4)return{club:from&&!pre?`${from.short} accepte l'indemnité.`:'',player:`${p.name} ne veut pas descendre en Pro D2 (il faudrait un salaire exceptionnel, environ ${fmtK(Math.round(dem*1.4))}).`};
  if(p.age>=32&&yrs>2)return{player:`${p.name} (${p.age} ans) ne signera pas plus de 2 ans.`};
  if(sal<dem*.97)return{club:from&&!pre?`${from.short} accepte l'indemnité.`:'',player:`${p.name} refuse : il demande au moins ${fmtK(dem)} par an.`};
  return{ok:true,club:from&&!pre?`${from.short} accepte l'indemnité.`:'',player:`${p.name} accepte !`};
}
// Offres des clubs IA pour les joueurs du joueur
function genOffers(n){
  const m=ME();G.offers=G.offers||[];
  for(let i=0;i<n;i++){
    const cands=m.squad.filter(p=>ovr(p)>=62&&p.ctr>0&&!G.offers.some(o=>o.pid===p.id));
    if(!cands.length)return;
    const w=cands.map(p=>valueOf(p)*(p.list?3:1));let r=R.f()*w.reduce((a,b)=>a+b,0),p=cands[0];
    for(let j=0;j<cands.length;j++){r-=w[j];if(r<=0){p=cands[j];break}}
    const buyers=G.clubs.filter(c=>c.id!==m.id&&c.lg!=='nat'&&(ovr(p)<74||c.lg==='t14')&&mass(c)+salaryFor(ovr(p),p.age,c.lg)<=capOf(c));
    if(!buyers.length)return;
    const b=R.pick(buyers);
    const fee=Math.round(askFee(p,m)*R.n(p.list?.85:1,.12)/10)*10;
    if(fee>0){G.offers.push({pid:p.id,club:b.id,fee,exp:G.phase==='season'?dAdd(G.date,7):null});mail('Directeur sportif',`Offre de ${b.short} pour ${p.name}`,`${b.name} propose <b>${fmtK(fee)}</b> pour ${p.name} (${posL(p)}, ${Math.round(ovr(p))}, valeur ${fmtK(valueOf(p))}).${G.phase==='season'?' L\'offre expire dans 7 jours.':''}`,{act:{tab:'market',mt:'offers'},imp:true})}
  }
}
// Mercato des clubs IA à l'intersaison
function aiMercato(){
  const m=ME(),ai=shuffle(G.clubs.filter(c=>c.id!==m.id));
  // 1) les gros clubs recrutent un ou deux joueurs dans des clubs plus faibles
  const strong=[...ai].sort((a,b)=>clubStr(b)-clubStr(a)).slice(0,10);
  for(const c of strong){
    if(R.f()<.4)continue;
    const g=R.pick(GORDER);
    const mine=c.squad.filter(x=>x.g===g).sort((a,b)=>ovr(b)-ovr(a));
    const ref=mine[Math.min(STARTERS[g],mine.length)-1];const refO=ref?ovr(ref):60;
    const targets=G.clubs.filter(x=>x!==c&&x.id!==m.id&&clubStr(x)<clubStr(c)).flatMap(x=>x.squad.filter(p=>p.g===g&&ovr(p)>refO+2&&p.age<=30).map(p=>({p,x})));
    if(!targets.length)continue;
    const t=R.pick(targets),sal=salaryFor(ovr(t.p),t.p.age,c.lg);
    if(mass(c)+sal>capOf(c))continue;
    doTransfer(t.p,t.x,c,askFee(t.p,t.x),sal,R.i(2,4));
  }
  // 2) les meilleurs joueurs libres signent d'abord dans les clubs qui peuvent les payer (Top 14 en priorité)
  for(const p of [...G.fa].sort((a,b)=>ovr(b)-ovr(a)).filter(p=>ovr(p)>=72)){
    const opts=ai.filter(c=>{const s=salaryFor(ovr(p),p.age,c.lg);const pos=c.squad.filter(x=>x.g===p.g).sort((a,b)=>ovr(b)-ovr(a));const ref=pos[Math.min(STARTERS[p.g],pos.length)-1];return mass(c)+s<=capOf(c)&&(!ref||ovr(p)>ovr(ref)-2)}).sort((a,b)=>(b.lg==='t14')-(a.lg==='t14')||b.bud-a.bud);
    if(opts.length){const c=opts[R.i(0,Math.min(2,opts.length-1))];doTransfer(p,null,c,0,salaryFor(ovr(p),p.age,c.lg),R.i(1,3))}
  }
  // 3) chaque club comble ses postes avec des joueurs libres, sinon avec des jeunes du centre de formation
  for(const c of [...ai].sort((a,b)=>b.bud-a.bud)){
    for(const g in COMP){
      let n=c.squad.filter(p=>p.g===g).length;
      while(n<COMP[g]){
        const fa=G.fa.filter(p=>p.g===g).map(p=>({p,s:salaryFor(ovr(p),p.age,c.lg)})).filter(x=>mass(c)+x.s<=capOf(c)).sort((a,b)=>ovr(b.p)-ovr(a.p));
        if(fa.length&&ovr(fa[0].p)>=c.str-14){doTransfer(fa[0].p,null,c,0,fa[0].s,R.i(1,3))}
        else if((c.youth||[]).some(y=>y.g===g&&y.age>=18)){const y=c.youth.filter(y=>y.g===g&&y.age>=18).sort((a,b)=>ovr(b)-ovr(a))[0];promoteYouth(c,y)}
        else{const p=genPlayer(g,c.str-14+R.n(0,3),R.i(18,20));p.pot=clamp(Math.round(ovr(p)+R.i(8,24)),55,92);p.ctr=3;p.sal=salaryFor(ovr(p),p.age,c.lg);c.squad.push(p)}
        n++;
      }
    }
  }
}

const SETTINGS_KEY='rugbyManager_settings';

function newGame(meId){

function finishSeason(){

  G.offers=[];genOffers(R.i(1,3));

function nextSeason(){
  const m=ME(),mv=G.moves;
  if(G.summary&&G.summary.fate==='nationale'){G.phase='sacked';return}
  // montées et descentes (le budget suit la division)
  for(const id of mv.up){const c=C(id);c.lg='t14';c.cap=c.cap||CAP_BASE;c.bud=Math.max(Math.round(c.bud*1.6),22000)}
  for(const id of mv.down){const c=C(id);c.lg='pd2';c.bud=Math.round(c.bud*.65)}
  for(const id of mv.natUp){const c=C(id);c.lg='pd2';c.bud=Math.max(c.bud,6000);if(!c.youth)initYouth(c)}
  for(const id of mv.pd2down){const c=C(id);G.nat.push([c.id,c.name,c.short,Math.round(Math.min(c.str,60))]);c.squad.forEach(p=>{if(R.f()<.5){p.ctr=0;p.faT=0;G.fa.push(p)}});G.clubs=G.clubs.filter(x=>x.id!==id)}

  for(const pc of G.pre||[]){const f=findPlayer(pc.pid);if(f.p&&f.club&&f.club.id!==m.id){doTransfer(f.p,f.club,m,0,pc.sal,pc.yrs);f.p.fresh=true}}

  // bilan de progression, vieillissement, contrats
  for(const c of G.clubs){
    const keep=[];
    for(const p of c.squad){
      const share=playShare(p,c);
      if(p.age<=23&&c.mp>0){
        if(share<.15){const old=p.pot;p.pot=Math.max(Math.round(ovr(p)),p.pot-R.i(1,3));if(c===m&&old-p.pot>=2)addNews(`📉 ${p.name} n'a presque pas joué : son potentiel baisse.`)}
        else if(share>=.6&&R.f()<.12+(p.pro||10)/100){p.pot=Math.min(99,p.pot+R.i(1,4));if(c===m)addNews(`🌟 ${p.name} explose cette saison : son potentiel augmente !`)}
      }

      p.age++;p.inj=0;p.ni=false;p.forme=90;
      if(p.age>=31){const dec=(p.age-30)*.11;for(const k of['vit','pui','end','evi'])p[k]=Math.max(1,p[k]-Math.max(0,R.n(dec,.12)));for(const k of['tac','mai','pas','rck','mel','tou'])p[k]=Math.max(1,p[k]-Math.max(0,R.n(dec*.3,.08)))}
      if(p.age>=23&&p.age<=32)for(const k of['pla','dec','sfr','lea'])p[k]=Math.min(20,p[k]+Math.max(0,R.n(.15,.12)));
      if(p.fresh){delete p.fresh;keep.push(p);continue}
      p.ctr--;
      if(p.age>=37||(p.ctr<=0&&(p.age>=36||(p.age>=34&&R.f()<.45)))){if(c===m||ovr(p)>=78)addNews(`👋 ${p.name} (${c.short}) prend sa retraite.`);continue}
      if(p.ctr<=0){
        if(c===m){addNews(`${p.name} (${posL(p)}) quitte le club libre, en fin de contrat.`);p.faT=0;p.sal=salaryFor(ovr(p),p.age,'pd2');G.fa.push(p);continue}
        if(R.f()<clamp(.65+(ovr(p)-70)/60,.5,.93)){p.ctr=R.i(1,3);p.sal=Math.max(8,salaryFor(ovr(p),p.age,c.lg))}
        else{p.faT=0;G.fa.push(p);continue}

  G.fa=G.fa.filter(p=>{p.faT=(p.faT||0)+1;if(p.faT>1)p.age++;return p.age<35&&p.faT<=2}).sort((a,b)=>ovr(b)-ovr(a)).slice(0,160);
  genFA(20);

  for(const c of G.clubs)if(c.id!==m.id)c.str=clamp(Math.round(clubStr({...c,lineup:autoLineup(c)})),55,88);
  // centre de formation et postes manquants pour le joueur
  // (les jeunes arrivent désormais par le centre de formation : génération annuelle le 15 mars, onglet Espoirs)
  for(const g in MINCOMP){const n=m.squad.filter(p=>p.g===g).length;for(let i=n;i<MINCOMP[g];i++){const p=genPlayer(g,R.n(m.lg==='t14'?58:55,3),R.i(22,28));p.ctr=1;p.sal=salaryFor(ovr(p),p.age,m.lg);m.squad.push(p);addNews(`Joker recruté au poste de ${GROUPS[g]} : ${p.name}.`)}}
  G.season++;
  startSeason();
  if(mass(m)>capOf(m))addNews(`⚠ Ta masse salariale dépasse ton plafond (${fmtK(capOf(m))}) : aucun recrutement possible tant que tu n'es pas repassé dessous.`);
  if(m.budget<0)addNews('⚠ Ta trésorerie est négative : plus aucune indemnité de transfert possible.');
  addNews(`Nouvelle saison ${seasonLabel()} en ${LEAGUES[m.lg].name} !`);
}

// ==== CALENDRIER (jour par jour) ====
const DAY=86400000;
const dAdd=(iso,n)=>new Date(Date.parse(iso+'T12:00:00Z')+n*DAY).toISOString().slice(0,10);
const dDow=iso=>new Date(iso+'T12:00:00Z').getUTCDay();
const dDiff=(a,b)=>Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/DAY);
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'],JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
function fmtD(iso,year){const d=new Date(iso+'T12:00:00Z');return JOURS[d.getUTCDay()]+' '+d.getUTCDate()+' '+MOIS[d.getUTCMonth()]+(year?' '+d.getUTCFullYear():'')}
function firstDow(iso,dow){let d=iso;while(dDow(d)!==dow)d=dAdd(d,1);return d}
const seasonYear=()=>2025+G.season;
// Week-ends sans match : semaines de coupes d'Europe, trêves (mois -> rang du week-end dans le mois)
const OFF={t14:{10:[3],11:[2],12:[2,3],1:[2,3],4:[1,2,3],5:[1]},pd2:{11:[2],12:[4],1:[1],2:[3],3:[2],4:[2]}};
function buildSchedule(lg){
  const y=seasonYear(),out=[];
  let d=lg==='t14'?firstDow(`${y}-09-01`,6):firstDow(`${y}-08-21`,5);
  while(out.length<LEAGUES[lg].rounds){
    const dt=new Date(d+'T12:00:00Z'),mo=dt.getUTCMonth()+1,wk=Math.ceil(dt.getUTCDate()/7);
    if(!((OFF[lg][mo]||[]).includes(wk)))out.push(d);
    d=dAdd(d,7);
  }
  const last=out[out.length-1];
  const po=lg==='t14'?[dAdd(last,7),dAdd(last,14),dAdd(last,28)]:[dAdd(last,7),dAdd(last,14),dAdd(last,21)];
  return{dates:out,poDates:po};
}
function myNextMatch(){
  const m=ME();
  if(G.phase==='access'){const f=(G.access||[]).find(f=>involves(f,m.id));return f?{f,d:G.accessDate}:null}
  if(G.phase!=='season')return null;
  const L=G.L[m.lg];
  if(L.phase==='regular'){for(let w=L.week;w<L.fixtures.length;w++){const x=L.fixtures[w].find(x=>x[0]===m.id||x[1]===m.id);if(x)return{f:{h:x[0],a:x[1]},d:L.dates[w],w}}}
  if(L.phase==='playoffs'){const f=L.po.next.find(f=>involves(f,m.id));if(f)return{f,d:L.poDates[L.po.stage]}}
  return null;
}
function windowOpen(){
  if(G.phase==='offseason')return 'été';
  if(G.phase!=='season'||!G.date)return null;
  const y=seasonYear();
  if(G.date<=`${y}-09-15`)return 'été';
  if(G.date>=`${y}-12-15`&&G.date<=`${y+1}-01-31`)return 'hiver';
  return null;
}

// ==== MESSAGERIE ====
function mail(from,subj,body,opt){
  opt=opt||{};G.mail=G.mail||[];
  G.mail.unshift({id:G.nid++,d:G.date,from,subj,body,read:false,act:opt.act||null});
  if(G.mail.length>200)G.mail.length=200;
  if(opt.imp)G.stop=true;
}
const unread=()=>(G.mail||[]).filter(x=>!x.read).length;
// Objectif fixé par le président selon la force de l'effectif dans sa division
function setObjective(){
  const m=ME(),lg=m.lg,ids=clubsIn(lg).sort((a,b)=>clubStr(b)-clubStr(a)).map(c=>c.id),r=ids.indexOf(m.id)+1,n=ids.length;
  let o;
  if(lg==='t14')o=r<=2?{t:1,l:'jouer le titre'}:r<=6?{t:6,l:'se qualifier pour les phases finales (top 6)'}:r<=10?{t:10,l:'finir dans la première moitié de tableau (top 10)'}:{t:12,l:'assurer le maintien (12e minimum)'};
  else o=r<=2?{t:2,l:'monter en Top 14'}:r<=6?{t:6,l:'se qualifier pour les phases finales (top 6)'}:r<=12?{t:12,l:'réaliser une saison solide (top 12)'}:{t:14,l:'assurer le maintien (14e minimum)'};
  G.obj={...o,pre:r};
  mail('Le président',`Objectifs de la saison ${seasonLabel()}`,`Bonjour coach,<br><br>Notre effectif est estimé ${r}e sur ${n} en ${LEAGUES[lg].name}. Pour cette saison, le conseil d'administration te demande de <b>${o.l}</b>.<br><br>Budget annuel : ${fmtK(m.bud)} · masse salariale autorisée : ${fmtK(capOf(m))} · trésorerie disponible : ${fmtK(m.budget)}.<br><br>Bonne saison !`,{act:{tab:'fin'}});
}
function scoutReport(nx){
  const m=ME(),o=C(nx.f.h===m.id?nx.f.a:nx.f.h),home=nx.f.h===m.id;
  const L=G.L[o.lg];
  const res=[];if(L)for(let w=L.results.length-1;w>=0&&res.length<5;w--){const r=(L.results[w]||[]).find(x=>x.h===o.id||x.a===o.id);if(r){const my=r.h===o.id?r.sh:r.sa,op=r.h===o.id?r.sa:r.sh;res.push(my>op?'V':my<op?'D':'N')}}
  const ol=autoLineup(o),key=[...o.squad].filter(p=>ol.includes(p.id)).sort((a,b)=>ovr(b)-ovr(a)).slice(0,3);
  const to=teamCalc({...o,lineup:ol}),tm=teamCalc(m);
  const cmp=(a,b,l)=>`${l} : ${Math.round(a)} contre ${Math.round(b)} ${a>b+2?'(avantage pour nous)':a<b-2?'(avantage pour eux)':'(équilibré)'}`;
  const inj=o.squad.filter(p=>p.inj>0&&ovr(p)>=72).map(p=>p.name);
  mail('Analyste vidéo',`Rapport d'avant-match : ${o.short}`,`<b>${fmtD(nx.d)} · ${home?'à domicile':'à l\'extérieur'} contre ${o.name}</b>${o.lg===m.lg&&rankOf(o.id)?` (${rankOf(o.id)}e)`:''}.<br><br>Forme récente : ${res.reverse().join(' ')||'—'}<br>Joueurs clés : ${key.map(p=>`${p.name} (${posL(p)}, ${Math.round(ovr(p))})`).join(', ')}<br>${inj.length?'Absents notables : '+inj.join(', ')+'<br>':''}<br>${cmp(tm.pack,to.pack,'Paquet d\'avants')}<br>${cmp(tm.backs,to.backs,'Trois-quarts')}<br>${cmp(tm.kick,to.kick,'Jeu au pied / buteur')}<br><br>${tm.pack>to.pack+3?'Conseil : appuie-toi sur la conquête.':tm.backs>to.backs+3?'Conseil : fais vivre le ballon derrière.':'Conseil : match serré, la discipline fera la différence.'}`,{act:{tab:'lineup'}});
}
function fitnessReport(){
  const m=ME(),tired=m.squad.filter(p=>p.inj===0&&p.forme<72).sort((a,b)=>a.forme-b.forme),inj=m.squad.filter(p=>p.inj>0).sort((a,b)=>b.inj-a.inj);
  if(!tired.length&&!inj.length)return;
  mail('Préparateur physique','Point physique de la semaine',`${tired.length?'<b>Joueurs fatigués</b> (à faire tourner) :<br>'+tired.slice(0,8).map(p=>`${p.name} · ${Math.round(p.forme)} %`).join('<br>')+'<br><br>':''}${inj.length?'<b>Infirmerie</b> :<br>'+inj.map(p=>`${p.name} · retour dans ${injDur(p.inj)}`).join('<br>'):''}`,{act:{tab:'squad'}});
}
const injDur=d=>d<7?`${d} jour${d>1?'s':''}`:`${Math.round(d/7)} semaine${Math.round(d/7)>1?'s':''}`;
function monthlyMails(){
  const m=ME(),L=G.L[m.lg];
  // temps de jeu
  if(m.mp>=4){const un=m.squad.filter(p=>p.age<31&&ovr(p)>=70&&playShare(p,m)<.25&&p.inj===0).sort((a,b)=>ovr(b)-ovr(a))[0];
    if(un)mail(un.name,'Je veux plus de temps de jeu',`Coach,<br><br>je n'ai joué que ${un.st.mj} match(s) depuis le début de saison. Je pense mériter ma place. Si ma situation ne change pas, je n'exclus pas de partir.<br><br>${un.name}`,{act:{player:un.id}})}
  // bilan du président
  if(L&&L.phase==='regular'&&L.week>=6&&G.obj){const r=rankOf(m.id),t=G.obj.t;
    mail('Le président','Point sur la saison',r<=t?`Nous sommes ${r}e. C'est conforme à l'objectif (${G.obj.l}). Continue comme ça.`:r<=t+3?`Nous sommes ${r}e, un peu en dessous de l'objectif (${G.obj.l}). Il faut redresser la barre.`:`Nous sommes ${r}e. C'est très loin de l'objectif (${G.obj.l}). Le conseil d'administration s'inquiète.`)}
}
// ==== AVANCER D'UN JOUR ====
function dailyUpdate(){
  for(const c of G.clubs)youthDaily(c);
  if(G.date&&G.date.endsWith('-03-15'))youthIntake();
  for(const c of G.clubs){
    const ks=FOCUSK[c.focus],lgK=c.lg==='t14'?1:c.lg==='pd2'?.85:.7;
    for(const p of c.squad){
      if(p.inj>0&&!p.ni)p.inj--;
      p.ni=false;
      p.forme=clamp(p.forme+(p.inj>0?1:3.2),20,100);
      if(p.inj>0)continue;
      const o=ovr(p),gap=(p.pot||o)-o;if(gap<=0)continue;
      const base=p.age<=20?.010:p.age<=23?.007:p.age<=26?.004:p.age<=29?.002:0;if(!base)continue;
      const play=.35+.9*(c.mp?playShare(p,c):.5),pro=.6+(p.pro||10)/20*.8;
      const da=base*gap*play*pro*lgK*(R.f()*.6+.7)/7*19/79;
      for(const key in W[p.g])p[key]=Math.min(20,p[key]+da);
      if(c.focus!=='equilibre')for(const key of ks)p[key]=Math.min(20,p[key]+da*.3);
    }
  }
}
function dayStep(){
  const m=ME();let mine=null;
  const wBefore=windowOpen();
  G.date=dAdd(G.date,1);
  if(G.phase==='access'){
    if(G.date>=G.accessDate){
      G.clubs.forEach(c=>{if(c===m&&m.autoXV===false)fixLineup(c);else c.lineup=autoLineup(c)});
      const out=playFixtures(G.access,true);G.access.res=out.map(slimR);
      mine=out.find(r=>involves(r,m.id))||null;if(mine){mine.others=G.access.res;mine.ko=true}
      finishSeason();
    }
  }else if(G.phase==='season'){
    for(const lg of LGORDER){
      const L=G.L[lg],due=L.phase==='regular'?L.dates[L.week]:L.phase==='playoffs'?L.poDates[L.po.stage]:null;
      if(!due||due>G.date)continue;
      clubsIn(lg).forEach(c=>{if(c===m&&m.autoXV===false)fixLineup(c);else c.lineup=autoLineup(c)});
      const reg=L.phase==='regular';
      if(lg===m.lg&&reg){const R_=LEAGUES[m.lg].rounds,inc=Math.round(m.bud*.72/R_),w=Math.round(mass(m)/R_),fx=Math.round(m.fixed/R_);m.budget+=inc-w-fx;G.fin.sponsor+=inc;G.fin.wages+=w;G.fin.opex+=fx}
      const r=stepLeague(lg);
      if(r&&lg===m.lg){mine=r;
        if(r.h===m.id&&!r.ko){const R_=LEAGUES[m.lg].rounds,n=clubsIn(m.lg).length,rk=rankOf(m.id)||n/2,attF=.85+.3*(1-(rk-1)/(n-1));const rev=Math.round(m.bud*.28/(R_/2)*attF);m.budget+=rev;G.fin.ticket+=rev;r.att=Math.round((m.lg==='t14'?14000:5000)*attF*(.9+R.f()*.2))}}
    }
    if(LGORDER.every(lg=>G.L[lg].phase==='done'))prepareAccess();
  }
  if(mine){
    const home=mine.h===m.id,o=C(home?mine.a:mine.h),my=home?mine.sh:mine.sa,op=home?mine.sa:mine.sh;
    addNews(`${mine.winner===m.id?'Victoire':my===op?'Match nul':'Défaite'} ${my}-${op} ${home?'contre':'à'} ${o.short}.`);
    G.lastMatch=mine;
  }
  dailyUpdate();
  // offres : expiration et nouvelles offres pendant les fenêtres
  G.offers=(G.offers||[]).filter(o=>!o.exp||o.exp>=G.date);
  if(G.phase==='season'&&windowOpen()&&R.f()<.05)genOffers(1);
  // courrier
  const wAfter=windowOpen();
  if(G.phase==='season'&&wBefore!==wAfter)mail('Directeur sportif',wAfter?`Ouverture du mercato ${wAfter==='hiver'?'d\'hiver':'d\'été'}`:'Fermeture du mercato',wAfter?'La fenêtre de transferts est ouverte. Tu peux acheter, vendre et recevoir des offres.':'La fenêtre de transferts est fermée. Restent possibles : les joueurs libres (jokers) et les pré-contrats.',{act:{tab:'market'}});
  if(G.phase==='season'||G.phase==='access'){
    const nx=myNextMatch();if(nx&&dDiff(G.date,nx.d)===1)scoutReport(nx);
    if(dDow(G.date)===1)fitnessReport();
    if(G.date.endsWith('-01'))monthlyMails();
    if(G.date.endsWith('-01-02')){const ex=m.squad.filter(p=>p.ctr<=1).sort((a,b)=>ovr(b)-ovr(a));if(ex.length)mail('Directeur sportif','Contrats qui arrivent à échéance',`${ex.length} joueur(s) sont en dernière année de contrat :<br>${ex.slice(0,12).map(p=>`${p.name} (${posL(p)}, ${Math.round(ovr(p))})`).join('<br>')}<br><br>Pense à les prolonger, sinon ils partiront libres en fin de saison — et les autres clubs peuvent déjà leur proposer un pré-contrat.`,{act:{tab:'squad'}})}
  }
  return mine;
}
// Avancer : 'day' = un jour, 'match' = jusqu'au prochain match (s'arrête sur un événement important)
function advance(mode){
  if(G.phase!=='season'&&G.phase!=='access')return null;
  G.lastMatch=null;G.stop=false;let mine=null,guard=0;
  do{mine=dayStep()}while(mode==='match'&&!mine&&!G.stop&&(G.phase==='season'||G.phase==='access')&&guard++<400);
  return mine;
}
function playRound(){return advance('match')}

// ==== CENTRES DE FORMATION ET ESPOIRS (regens façon FM) ====
// Qualité du centre de formation sur 20 (estimation d'après la réputation des académies)
const ACAD={tou:20,cle:18,rac:17,ubb:16,lar:15,mon:15,sfp:15,pau:15,lou:14,tln:13,cas:13,bay:13,per:13,van:11,
  bri:13,gre:12,bia:12,age:12,col:12,mtb:11,oyo:11,pro:11,dax:11,vro:10,soy:10,bez:10,nev:10,aur:9,nic:9,nar:9};
const acadOf=c=>c.acad||ACAD[c.id]||(c.lg==='t14'?13:c.lg==='pd2'?10:7);
function genYouthPlayer(c,age){
  const a=acadOf(c);
  const g=R.pick(GORDER.flatMap(x=>Array(COMP[x]).fill(x)));
  const lvl=R.n(37+a*.6+(age-16)*5,4);
  const p=genPlayer(g,lvl,age);
  const r=R.f();
  let pa=58+a*.6+R.n(0,7);
  if(r<.002+a*.0009){pa=R.i(88,97);p.pro=Math.max(p.pro,R.i(12,20));p.gem=true}
  else if(r<.07)pa+=R.i(6,12);
  p.pot=Math.round(clamp(pa,Math.round(ovr(p))+5,97));
  p.youth=true;p.ctr=0;p.sal=12;p.nat='France';
  return p;
}
function realYouth(r){
  const [n,g,sub,by,nat,u20,rt,pot]=r,age=2026-by;
  const p={id:G.nid++,name:n,g,age,forme:90,inj:0,ni:false,ctr:0,st:{mj:0,tit:0,es:0,pts:0},real:true,nat,sub,tags:'',caps:0,hist:[],youth:true,sal:12};
  buildAttrs(p,g,clamp(rt,40,75),k=>(hashN(n+k)-.5)*2.6);
  p.pro=clamp(Math.round(6+hashN(n+'pro')*11+(u20?3:0)),1,20);
  p.pot=Math.round(clamp(pot,Math.round(ovrAt(p,g))+3,97));
  if(p.pot>=85)p.gem=true;
  if(u20)p.ev='International jeunes (U20/U18)';
  return p;
}
function initYouth(c){
  c.youth=(REALY[c.id]||[]).map(realYouth);
  while(c.youth.length<12)c.youth.push(genYouthPlayer(c,R.i(16,19)));
}
function youthIntake(){
  const m=ME();
  for(const c of G.clubs){
    if(c.lg==='nat')continue;
    c.youth=c.youth||[];
    const n=R.i(4,7),news=[];
    for(let i=0;i<n;i++){const p=genYouthPlayer(c,R.i(16,17));c.youth.push(p);news.push(p)}
    if(c===m){
      const best=[...news].sort((a,b)=>b.pot-a.pot)[0];
      const gem=news.find(p=>p.gem);
      mail('Directeur du centre de formation',`Nouvelle génération : ${n} jeunes intègrent le centre`,`${n} jeunes de 16-17 ans rejoignent nos espoirs :<br>${news.map(p=>`${p.name} · ${posL(p)} · note ${Math.round(ovr(p))} · potentiel ≈ ${p.pot}`).join('<br>')}<br><br>${gem?`<b>Attention, ${gem.name} a un talent exceptionnel. Il faut le faire progresser avec soin.</b>`:`Le plus prometteur semble être ${best.name}.`}`,{act:{tab:'youth'}});
    }
  }
}
function youthDaily(c){
  const a=acadOf(c),k=.7+a/40;
  for(const p of c.youth||[]){
    if(p.inj>0){p.inj--;continue}
    const o=ovr(p),gap=p.pot-o;if(gap<=0)continue;
    const base=p.age<=17?.007:p.age<=20?.005:.003,pro=.6+(p.pro||10)/20*.8;
    const da=base*gap*.75*k*pro*(R.f()*.6+.7)/7*19/79;
    for(const key in W[p.g])p[key]=Math.min(20,p[key]+da);
  }
}
function promoteYouth(c,p){
  c.youth=c.youth.filter(x=>x.id!==p.id);
  p.youth=false;p.ctr=3;p.sal=Math.max(15,salaryFor(ovr(p),p.age,c.lg));p.st={mj:0,tit:0,es:0,pts:0};p.o0=Math.round(ovr(p));
  c.squad.push(p);
}
// Fin de saison : âge, sorties des espoirs de 21 ans, promotions des clubs IA
function youthSeasonEnd(c){
  const m=ME(),keep=[];
  for(const p of c.youth||[]){
    p.age++;
    if(p.age>=21){
      if(c===m){addNews(`${p.name} (espoir, 21 ans) quitte le centre de formation faute de contrat pro.`);if(ovr(p)>=48){p.youth=false;p.ctr=0;p.faT=0;p.sal=salaryFor(ovr(p),p.age,'pd2');G.fa.push(p)}continue}
      const pos=c.squad.filter(x=>x.g===p.g).sort((a,b)=>ovr(a)-ovr(b));
      if(ovr(p)>=(pos[0]?ovr(pos[0])-4:0)||p.pot>=c.str+5){promoteYouth(c,p);continue}
      if(ovr(p)>=48){p.youth=false;p.ctr=0;p.faT=0;p.sal=salaryFor(ovr(p),p.age,'pd2');G.fa.push(p)}
      continue;
    }
    // les clubs IA lancent tôt leurs meilleurs jeunes
    if(c!==m&&((p.age>=19&&ovr(p)>=c.str-8)||(p.gem&&p.age>=18&&ovr(p)>=c.str-15))){promoteYouth(c,p);continue}
    keep.push(p);
  }
  // 25 espoirs maximum : on garde les plus prometteurs
  c.youth=keep.sort((a,b)=>b.pot-a.pot).slice(0,25);
}

<script>
// ==== UI ====
const SAVE_KEY='rugbyManager_v8';
const UI={modal:null,mf:'ALL',ef:'ALL',pid:null,mt:'search',ml:'ALL',ms:'ALL',mo:60,ma:40,neg:null,negMsg:''};
const k=n=>Math.abs(n)>=1000?(n/1000).toFixed(2).replace('.',',')+' M€':Math.round(n)+' k€';
const oc=v=>v>=78?'o1':v>=68?'o2':v>=58?'o3':'o4';
const rd=Math.round;
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));return true}catch(e){return false}}
function load(){try{const s=localStorage.getItem(SAVE_KEY);if(!s)return false;G=JSON.parse(s);return true}catch(e){return false}}
const $app=document.getElementById('app');

function posL(p){return p.g==='PIL'?(p.sub==='TH'?'Pilier droit':'Pilier gauche'):p.g==='3L'?(p.sub==='N8'?'Numéro 8':p.sub==='FL'?'Flanker':GROUPS[p.g]):GROUPS[p.g]}
function injTxt(p){return p.inj>0?`<span class="ko">🚑 ${injDur(p.inj)}</span>`:'<span class="ok">Apte</span>'}
function formeBar(f){return `<div class="bar" title="${rd(f)}%"><i style="width:${f}%;background:${f>75?'var(--acc)':f>50?'var(--acc2)':'var(--bad)'}"></i></div>`}

function render(){
  if(!G){$app.innerHTML=viewStart();return}
  if(G.phase==='sacked'){$app.innerHTML=viewSacked();return}
  const m=ME();

function viewHelp(){
  return `<div class="card help"><h2>Rugby 101 : comprendre le jeu</h2>
  <h3>Le but</h3><p>Deux équipes de 15 joueurs s'affrontent pendant 80 minutes (2 mi-temps de 40). On marque en portant le ballon dans l'en-but adverse ou en tapant dans les poteaux.</p>
  <ul><li><b>Essai : 5 points</b> (on aplatit le ballon dans l'en-but).</li><li><b>Transformation : 2 points</b> (coup de pied après l'essai, facultatif mais toujours tenté).</li><li><b>Pénalité : 3 points</b> (coup de pied entre les poteaux après une faute adverse).</li><li><b>Drop : 3 points</b> (coup de pied en cours de jeu, ballon qui touche le sol juste avant).</li></ul>
  <h3>Les 15 joueurs</h3>
  <p><b>Les avants (n°1 à 8)</b> : les costauds, qui gagnent le ballon.</p>
  <ul><li>1 et 3 <b>Piliers</b> + 2 <b>Talonneur</b> : première ligne, poussent en mêlée, le talonneur lance en touche.</li><li>4 et 5 <b>Deuxièmes lignes</b> : les grands, sauteurs en touche.</li><li>6, 7 <b>Flankers</b> et 8 <b>Numéro 8</b> : troisièmes lignes, plaquent et portent le ballon, très endurants.</li></ul>
  <p><b>Les trois-quarts (n°9 à 15)</b> : plus rapides, ils animent le jeu et marquent.</p>
  <ul><li>9 <b>Demi de mêlée</b> : relais entre avants et trois-quarts.</li><li>10 <b>Ouvreur</b> : le « cerveau », distribue, tape et souvent botteur.</li><li>12 et 13 <b>Centres</b> : percutent et passent.</li><li>11 et 14 <b>Ailiers</b> : les plus rapides, finisseurs.</li><li>15 <b>Arrière</b> : dernier rempart, relance et jeu au pied.</li></ul>
  <p>Il y a aussi <b>8 remplaçants</b> (16 à 23) : tu peux les faire entrer en cours de match.</p>
  <h3>Les phases de jeu</h3><ul><li><b>Mêlée</b> : les avants s'opposent et poussent pour récupérer le ballon après une faute légère.</li><li><b>Touche</b> : remise en jeu quand le ballon sort sur les côtés ; les joueurs sont soulevés pour attraper le ballon.</li><li><b>Ruck / maul</b> : regroupements autour du ballon au sol / porté.</li><li><b>Plaquage</b> : on stoppe l'adversaire en le faisant tomber.</li></ul>
  <h3>Dans ce jeu</h3>
  <ul><li><b>Attributs et note</b> : comme dans Football Manager, chaque joueur a 17 attributs notés sur 20 (technique : plaquage, prise de balle, passe, évitement, jeu au pied, buteur, mêlée, touche, jeu au sol ; mental : placement, décisions, sang-froid, leadership, engagement ; physique : vitesse, puissance, endurance). Sa note sur 99 est une moyenne pondérée selon le poste : la mêlée compte énormément pour un pilier, la vitesse pour un ailier, les décisions et le jeu au pied pour un ouvreur. Le buteur du match est le meilleur « Buteur » parmi le 9, le 10 et le 15.</li><li><b>Forme</b> : baisse après un match, remonte en semaine. Un joueur fatigué joue moins bien. Fais tourner l'effectif.</li><li><b>Style de jeu</b> : conquête = plus de pénalités, moins d'essais ; mouvement = plus d'essais mais plus de risques ; pied = territoire et drops.</li><li><b>Plafond salarial</b> : un club ne peut pas dépasser une masse salariale fixée (ici ${k(LEAGUES.t14.cap)} en Top 14 et ${k(LEAGUES.pd2.cap)} en Pro D2).</li><li><b>Bonus (règles LNR, Top 14 et Pro D2)</b> : 1 point de classement pour avoir marqué au moins 3 essais de plus que l'adversaire, et 1 point pour une défaite de 5 points ou moins.</li><li><b>Top 14</b> : 14 clubs, 26 journées, puis phases finales pour les 6 premiers (barrages 3e-6e et 4e-5e, demi-finales contre le 1er et le 2e, finale). Le 14e descend en Pro D2 ; le 13e joue un barrage d'accession chez le finaliste perdant de Pro D2.</li><li><b>Pro D2</b> : 16 clubs, 30 journées, même format de phases finales. Le champion monte en Top 14, le finaliste perdant joue le barrage d'accession. Le 16e descend en Nationale et le 15e joue un barrage chez le finaliste de Nationale.</li><li><b>Potentiel</b> : chaque joueur a une note actuelle et un potentiel (note maximale). Les jeunes progressent chaque semaine vers leur potentiel, d'autant plus vite qu'ils sont titulaires, professionnels et jouent en Top 14. Après 30 ans, les qualités physiques déclinent. Affichage réglable dans Réglages.</li><li><b>Mercato</b> : fenêtres en intersaison et de la 10e à la 13e journée. Une offre = une indemnité pour le club (souvent plus chère pour un cadre ou un joueur avec un long contrat) + un salaire et une durée pour le joueur. Les joueurs libres (jokers) se signent toute l'année, et un joueur en dernière année de contrat peut signer un pré-contrat gratuit pour la saison suivante.</li><li><b>Salary cap</b> : en Top 14, 11 M€ de base + 180 k€ par international français de 2025 (13,8 M€ pour Toulouse). En Pro D2, c'est le budget qui limite la masse salariale.</li><li><b>Descendre en Nationale</b> met fin à ta carrière (partie terminée). Descendre du Top 14 en Pro D2 ne te coûte pas ta place, mais tes revenus baissent fortement.</li></ul></div>`;
}

// ---- potentiel : affichage selon les réglages ----
const potMode=()=>{const v=(G.settings&&G.settings.pot)||'exact';return v==='stars'?'exact':v};
function potEst(p){const f=findPlayer(p.id);if(f.club&&f.club.id===G.meId)return p.pot;return clamp(Math.round(p.pot+(hashN(p.name+G.meId)-.5)*8),Math.round(ovr(p)),99)}
function starsTxt(v){const s=clamp(Math.round((v-45)/10*2)/2,.5,5);return '★'.repeat(Math.floor(s))+(s%1?'½':'')}
function potCell(p){const v=potEst(p),own=(findPlayer(p.id).club||{}).id===G.meId;return potMode()==='exact'?`<td class="n mut">${own?'':'≈'}${v}</td>`:`<td class="mut" title="Potentiel estimé">${starsTxt(v)}</td>`}
const potTh=()=>potMode()==='hide'?'':'<th>Pot.</th>';
const potTd=p=>potMode()==='hide'?'':potCell(p);
function progTxt(p){const d=Math.round(ovr(p))-(p.o0||Math.round(ovr(p)));return d>0?`<span class="ok">+${d}</span>`:d<0?`<span class="ko">${d}</span>`:'<span class="mut">=</span>'}
const plink=p=>`<a style="cursor:pointer;color:var(--blue)" data-a="player" data-id="${p.id}">${p.name}</a>`;
function winBanner(){const w=windowOpen();return w?`<p class="ok"><b>Mercato ${w==='été'?"d'été":"d'hiver"} ouvert.</b> Tu peux acheter, vendre et recevoir des offres.</p>`:`<p class="mut">Fenêtre de transferts fermée (elle ouvre à l'intersaison et de la 10e à la 13e journée). Restent possibles : les joueurs libres (jokers) et les pré-contrats avec les joueurs en dernière année.</p>`}

const ac=v=>v>=16?'o1':v>=11?'o2':v>=6?'o3':'o4';
// moyenne d'un groupe d'attributs, pondérée par l'importance au poste
function grpAvg(p,gr){let s=0,w=0;for(const [k,,g] of ATTRS)if(g===gr){const x=W[p.g][k]||.02;s+=p[k]*x;w+=x}return s/w}
const grpTh=()=>'<th class="n" title="Technique (pondérée selon le poste)">Tec</th><th class="n" title="Mental">Men</th><th class="n" title="Physique">Phy</th>';
const grpTd=p=>['T','M','P'].map(g=>{const v=grpAvg(p,g);return `<td class="n ${ac(v)}">${v.toFixed(1)}</td>`}).join('');
function attrTable(p){
  return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px">${['T','M','P'].map(g=>`<div><h3 style="margin:4px 0">${AGRP[g]}</h3><table>${ATTRS.filter(a=>a[2]===g).map(([k,l])=>`<tr><td>${(W[p.g][k]||0)>=.1?'<b>'+l+'</b>':l}</td><td class="n ${ac(p[k])}"><b>${Math.round(p[k])}</b></td></tr>`).join('')}</table></div>`).join('')}</div><p class="mut">Attributs sur 20. En gras : les plus importants pour son poste. Ils forment sa note sur 99.</p>`;
}
function viewSquad(){

  return `<div class="card"><div class="row"><h2 style="margin:0">Effectif (${m.squad.length})</h2><select data-a="ef"><option value="ALL">Tous les postes</option>${GORDER.map(g=>`<option value="${g}" ${UI.ef===g?'selected':''}>${GROUPS[g]}</option>`).join('')}</select><span class="mut">Masse ${k(mass(m))} / ${k(capOf(m))}</span></div>
  <table style="margin-top:10px"><tr><th>Nom</th><th>Poste</th><th>Âge</th><th class="n">Note</th>${potTh()}<th class="n">Prog.</th>${grpTh()}<th>Forme</th><th>État</th><th class="n">Tit/MJ</th><th class="n">Ctr</th><th class="n">Salaire</th><th class="n">Valeur</th><th></th></tr>
  ${list.map(p=>`<tr><td>${plink(p)}${p.list?' <span class="warn" title="Sur la liste des transferts">€</span>':''}</td><td>${posL(p)}</td><td>${p.age}</td><td class="n ${oc(ovr(p))}"><b>${rd(ovr(p))}</b></td>${potTd(p)}<td class="n">${progTxt(p)}</td>${grpTd(p)}<td>${formeBar(p.forme)}</td><td>${injTxt(p)}</td><td class="n">${p.st.tit||0}/${p.st.mj}</td><td class="n ${p.ctr<=1?'warn':''}">${p.ctr}</td><td class="n">${k(p.sal)}</td><td class="n">${k(valueOf(p))}</td><td><button class="btn sec sm" data-a="neg" data-id="${p.id}" data-mode="renew">Contrat</button></td></tr>`).join('')}</table>
  <p class="mut">Prog. = progression de la note depuis le début de saison. Un jeune qui joue progresse vite vers son potentiel ; un jeune qui ne joue pas stagne et peut voir son potentiel baisser.</p></div>`;
}
function marketPool(){
  const out=[];
  for(const c of G.clubs){if(c.id===G.meId)continue;for(const p of c.squad)out.push({p,c})}
  for(const p of G.fa)out.push({p,c:null});
  return out;
}
function viewMarket(){
  const m=ME(),sub=UI.mt||'search';
  const tabs=[['search','Recherche'],['offers',`Offres reçues (${(G.offers||[]).length})`],['pre',`Pré-contrats (${(G.pre||[]).length})`],['log','Historique']];
  let h=`<div class="card"><div class="row"><h2 style="margin:0">Mercato</h2>${tabs.map(t=>`<button class="btn ${t[0]===sub?'':'sec'} sm" data-a="mt" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
  ${winBanner()}<p class="mut">Trésorerie : <b>${k(m.budget)}</b> · Masse salariale : <b>${k(mass(m))}</b> / ${k(capOf(m))} (marge ${k(Math.max(0,capOf(m)-mass(m)))}) · Effectif : ${m.squad.length}/50</p>`;

    let pool=marketPool().filter(({p,c})=>(UI.mf==='ALL'||p.g===UI.mf)&&ovr(p)>=(+UI.mo||60)&&p.age<=(+UI.ma||40)&&((UI.ml||'ALL')==='ALL'||(UI.ml==='fa'?!c:c&&c.lg===UI.ml))&&((UI.ms||'ALL')==='ALL'||(c&&p.ctr<=1)));
    pool.sort((a,b)=>ovr(b.p)-ovr(a.p));

    ${pool.map(({p,c})=>`<tr><td>${plink(p)}</td><td>${posL(p)}</td><td>${p.age}</td><td class="n ${oc(ovr(p))}"><b>${rd(ovr(p))}</b></td>${potTd(p)}${grpTd(p)}<td>${c?c.short+' <span class="mut">'+(c.lg==='t14'?'T14':'PD2')+'</span>':'<span class="ok">Libre</span>'}</td><td class="n">${c?p.ctr:'-'}</td><td class="n">${k(p.sal)}</td><td class="n">${k(valueOf(p))}</td><td class="n">${c?k(askFee(p,c)):'0'}</td><td><button class="btn sm" data-a="neg" data-id="${p.id}" data-mode="${c?'buy':'fa'}">${c?'Offre':'Signer'}</button>${c&&p.ctr<=1&&G.phase==='season'?` <button class="btn sec sm" data-a="neg" data-id="${p.id}" data-mode="pre">Pré-contrat</button>`:''}</td></tr>`).join('')}</table>`;
  }else if(sub==='offers'){
    const of=G.offers||[];

  }else if(sub==='pre'){
    h+=(G.pre||[]).length?`<table><tr><th>Joueur</th><th>Club actuel</th><th class="n">Salaire</th><th class="n">Durée</th></tr>${G.pre.map(x=>{const f=findPlayer(x.pid);return f.p?`<tr><td>${plink(f.p)}</td><td>${f.club?f.club.short:'-'}</td><td class="n">${k(x.sal)}</td><td class="n">${x.yrs} an(s)</td></tr>`:''}).join('')}</table><p class="mut">Ces joueurs te rejoindront gratuitement au début de la saison prochaine.</p>`:'<p class="mut">Aucun pré-contrat. Pendant la saison, un joueur en dernière année de contrat peut signer chez toi gratuitement pour la saison suivante (filtre « Dernière année »).</p>';
  }else{
    h+=(G.tlog||[]).length?G.tlog.slice(0,60).map(t=>`<p>• ${t}</p>`).join(''):'<p class="mut">Aucun transfert pour le moment.</p>';
  }
  return h+'</div>';
}

function playerModal(){
  const f=findPlayer(UI.pid),p=f.p;if(!p)return '';
  const own=f.club&&f.club.id===G.meId,c=f.club;
  const potTxt=potMode()==='hide'?'':` · potentiel ${potMode()==='exact'?(own?'':'≈')+potEst(p):starsTxt(potEst(p))}`;
  const acts=own&&p.youth?`<button class="btn sm" data-a="promote" data-id="${p.id}">Promouvoir en équipe pro</button>`:own?`<button class="btn sm" data-a="neg" data-id="${p.id}" data-mode="renew">Négocier son contrat</button> <button class="btn sec sm" data-a="listP" data-id="${p.id}">${p.list?'Retirer de la liste des transferts':'Placer sur la liste des transferts'}</button> <button class="btn bad sm" data-a="release" data-id="${p.id}">Libérer</button>`
    :c?`<button class="btn sm" data-a="neg" data-id="${p.id}" data-mode="buy">Faire une offre</button>${p.ctr<=1&&G.phase==='season'?` <button class="btn sec sm" data-a="neg" data-id="${p.id}" data-mode="pre">Pré-contrat</button>`:''}`
    :`<button class="btn sm" data-a="neg" data-id="${p.id}" data-mode="fa">Faire signer</button>`;
  return `<div class="overlay"><div class="modal"><h2>${p.name}</h2><p>${posL(p)}${p.nat?' · '+p.nat:''}${p.caps?' · '+p.caps+' sélection'+(p.caps>1?'s':''):''} · ${p.age} ans · ${c?c.name:'<span class="ok">sans club</span>'}</p>
  <p>Note <b class="${oc(ovr(p))}">${rd(ovr(p))}</b>${potTxt} · valeur ${k(valueOf(p))} · salaire ${k(p.sal)}/an${c?` · contrat ${p.ctr} an(s)`:''}</p>
  ${attrTable(p)}
  ${p.ev?`<p class="mut">${p.ev}</p>`:''}<p>Cette saison : ${p.st.mj} match(s) dont ${p.st.tit||0} titularisation(s), ${p.st.es} essai(s), ${p.st.pts} points.</p>
  ${(p.hist||[]).length?`<h3>Carrière</h3><table><tr><th>Saison</th><th>Club</th><th class="n">Note</th><th class="n">Matchs</th><th class="n">Essais</th></tr>${p.hist.map(h=>`<tr><td>${h.s}</td><td>${h.c}</td><td class="n">${h.o}</td><td class="n">${h.mj}</td><td class="n">${h.es}</td></tr>`).join('')}</table>`:''}
  <p>${acts} <button class="btn sec sm" data-a="closeModal">Fermer</button></p></div></div>`;
}
function negModal(){
  const N=UI.neg,f=findPlayer(N.pid),p=f.p,m=ME();if(!p)return '';
  const c=f.club,mode=N.mode;
  const dem=mode==='renew'?wageDemand(p,m,'renew'):wageDemand(p,m,mode==='pre'?'pre':'move');
  const ask=mode==='buy'?askFee(p,c):0;
  const title={renew:'Prolongation de contrat',buy:'Offre de transfert',fa:'Signature d\'un joueur libre',pre:'Pré-contrat (arrivée la saison prochaine)'}[mode];
  const defY=p.age>=32?1:p.age>=29?2:3;
  return `<div class="overlay"><div class="modal"><h2>${title}</h2>
  <p><b>${p.name}</b> · ${posL(p)} · ${p.age} ans · note <b class="${oc(ovr(p))}">${rd(ovr(p))}</b>${potMode()==='hide'?'':' · potentiel '+(potMode()==='exact'?potEst(p):starsTxt(potEst(p)))} · ${c?c.short+', contrat '+p.ctr+' an(s)':'libre'} · salaire actuel ${k(p.sal)}</p>
  ${mode==='buy'?`<p>Indemnité demandée par ${c.short} : <b>environ ${k(ask)}</b> (valeur ${k(valueOf(p))}).</p>`:''}
  <p>Ses exigences salariales : <b>environ ${k(dem)} par an</b>.</p>
  <p class="mut">Trésorerie ${k(m.budget)} · marge salariale ${k(Math.max(0,capOf(m)-mass(m)+(mode==='renew'?p.sal:0)))}</p>
  <div class="row">${mode==='buy'?`<label>Indemnité (k€)<br><input id="ng-fee" type="number" min="0" step="10" value="${N.fee??ask}" style="width:110px"></label>`:''}
  <label>Salaire annuel (k€)<br><input id="ng-sal" type="number" min="0" step="5" value="${N.sal??dem}" style="width:110px"></label>
  <label>Durée (ans)<br><input id="ng-yrs" type="number" min="1" max="5" value="${N.yrs??defY}" style="width:70px"></label></div>
  ${UI.negMsg?`<div class="card" style="margin-top:10px">${UI.negMsg}</div>`:''}
  <p style="margin-top:10px"><button class="btn" data-a="sendNeg">Proposer</button> <button class="btn sec" data-a="closeModal">Fermer</button></p></div></div>`;
}

function modalView(){
  const m=UI.modal;
  if(m.type==='match'){
    const r=G.lastMatch;if(!r)return '';
    const h=C(r.h),a=C(r.a);
    const done=r.others||[];
    return `<div class="overlay"><div class="modal"><div class="vs"><div>${h.short}</div><div class="score">${r.sh} - ${r.sa}</div><div>${a.short}</div></div>
    <p class="mut" style="text-align:center">Essais ${r.th}-${r.ta} · Pénalités ${r.pn[0]}-${r.pn[1]} · Drops ${r.dr[0]}-${r.dr[1]} · Possession ${r.ph}%-${100-r.ph}% · Cartons jaunes ${r.yc[0]}-${r.yc[1]}${r.att?` · Affluence ${r.att}`:''}</p>
    <p class="mut" style="text-align:center">Points de classement : ${!r.ko?`${h.short} ${(r.sh>r.sa?4:r.sh===r.sa?2:0)+r.bo[0]} · ${a.short} ${(r.sa>r.sh?4:r.sh===r.sa?2:0)+r.bo[1]}`:'match à élimination directe'}</p>
    <div style="max-height:340px;overflow:auto">${r.ev.map(e=>`<div class="ev ${e.k}"><span class="m">${e.m}'</span><span>${e.x}</span></div>`).join('')||'<p class="mut">Match fermé, peu d\'événements.</p>'}</div>
    <h3 style="margin-top:12px">Autres résultats</h3>${done.filter(x=>!(x.h===r.h&&x.a===r.a)).map(x=>`<div>${C(x.h).short} <b>${x.sh} - ${x.sa}</b> ${C(x.a).short}</div>`).join('')}
    <p><button class="btn" data-a="closeModal">Continuer</button></p></div></div>`;
  }
  if(m.type==='player')return playerModal();
  if(m.type==='neg')return negModal();

const ACT={
  start(d){newGame(d.id);save();render()},
  continue(){if(load())render()},
  menu(){G=null;render()},
  save(){const ok=save();addNews(ok?'Partie sauvegardée.':'Sauvegarde impossible dans ce navigateur.');render()},
  tab(d){G.tab=d.t;render()},
  lgsel(d){UI.lg=d.lg;render()},
  play(){ACT.toMatch()},
  cont(){const r=advance('day');save();if(r)UI.modal={type:'match'};render()},
  toMatch(){const r=advance('match');save();if(r)UI.modal={type:'match'};else if(G.stop){G.tab='mail';UI.mid=(G.mail[0]||{}).id}render()},
  openMail(d){UI.mid=+d.id;render()},
  promote(d){const m=ME(),p=(m.youth||[]).find(x=>x.id===+d.id);if(!p)return;if(m.squad.length>=50){addNews('Effectif pro complet (50 joueurs).');return render()}
    const s=Math.max(15,salaryFor(ovr(p),p.age,m.lg));if(mass(m)+s>capOf(m)){addNews('Plafond salarial dépassé : impossible de signer ce contrat pro.');return render()}
    promoteYouth(m,p);addNews(`✍ ${p.name} signe son premier contrat pro (3 ans, ${fmtK(p.sal)}/an).`);UI.modal=null;save();render()},
  relYouth(d){const m=ME(),p=(m.youth||[]).find(x=>x.id===+d.id);if(!p)return;if(!confirm(`Libérer l'espoir ${p.name} ?`))return;m.youth=m.youth.filter(x=>x.id!==p.id);save();render()},
  mailAct(d){const x=(G.mail||[]).find(y=>y.id===+d.id);if(!x||!x.act)return;if(x.act.player){UI.modal={type:'player'};UI.pid=x.act.player}else{G.tab=x.act.tab;if(x.act.mt)UI.mt=x.act.mt}render()},
  closeModal(){UI.modal=null;render()},
  autoXV(){const m=ME();m.autoXV=m.autoXV===false;if(m.autoXV)m.lineup=autoLineup(m);save();render()},
  slot(d,el){const i=+d.i,id=el.value?+el.value:null,m=ME();m.autoXV=false;if(id){const j=m.lineup.indexOf(id);if(j>=0&&j!==i)m.lineup[j]=m.lineup[i]}m.lineup[i]=id;save();render()},
  auto(){const m=ME();m.lineup=autoLineup(m);save();render()},
  tac(d,el){const m=ME();if(d.k==='focus')m.focus=el.value;else m.tac[d.k]=el.value;save();render()},
  ef(d,el){UI.ef=el.value;render()},
  player(d){UI.modal={type:'player'};UI.pid=+d.id;render()},
  neg(d){UI.neg={pid:+d.id,mode:d.mode};UI.negMsg='';UI.modal={type:'neg'};render()},
  sendNeg(){
    const N=UI.neg,f=findPlayer(N.pid),p=f.p,m=ME();if(!p)return;
    const val=id=>{const e=document.getElementById(id);return e&&e.value!==undefined?+e.value:NaN};
    const fee=N.mode==='buy'?Math.max(0,Math.round(val('ng-fee')||0)):0,sal=Math.max(0,Math.round(val('ng-sal')||0)),yrs=Math.round(val('ng-yrs')||0);
    N.fee=fee;N.sal=sal;N.yrs=yrs;
    let r;
    if(N.mode==='renew'){
      const dem=wageDemand(p,m,'renew'),unhappy=m.mp>=6&&playShare(p,m)<.3&&ovr(p)>=70&&p.age<30;
      if(yrs<1||yrs>5)r={msg:'Durée : entre 1 et 5 ans.'};
      else if(mass(m)-p.sal+sal>capOf(m))r={msg:`Plafond salarial dépassé : marge ${fmtK(Math.max(0,capOf(m)-mass(m)+p.sal))}.`};
      else if(sal<dem*(unhappy?1.25:.97))r={player:unhappy?`${p.name} manque de temps de jeu : il ne prolongera que pour environ ${fmtK(Math.round(dem*1.25))} par an.`:`${p.name} refuse : il demande au moins ${fmtK(dem)} par an.`};
      else{p.sal=sal;p.ctr=yrs;if(G.phase==='offseason')p.fresh=true;addNews(`✍ ${p.name} prolonge de ${yrs} an(s) (${fmtK(sal)}/an).`);UI.modal=null;save();return render()}
    }else{
      if(N.mode==='pre'&&(G.pre||[]).some(x=>x.pid===p.id))r={msg:'Pré-contrat déjà signé avec ce joueur.'};
      else r=evalOffer(p,f.club,fee,sal,yrs,N.mode==='pre');
      if(r.ok){
        if(N.mode==='pre'){G.pre.push({pid:p.id,sal,yrs});addNews(`✍ Pré-contrat signé : ${p.name} rejoindra le club la saison prochaine (${fmtK(sal)}/an, ${yrs} an(s)).`)}
        else doTransfer(p,f.club,m,fee,sal,yrs);
        UI.modal=null;save();return render();
      }
    }
    UI.negMsg=[r.msg,r.club,r.player].filter(Boolean).map(x=>`<p>${x}</p>`).join('');render();
  },
  acceptOffer(d){
    const m=ME(),o=G.offers[+d.i];if(!o)return;const p=m.squad.find(x=>x.id===o.pid),b=C(o.club);
    if(!p||!b){G.offers.splice(+d.i,1);return render()}
    if(m.squad.length<=28){addNews('Effectif minimum de 28 joueurs : vente impossible.');return render()}
    doTransfer(p,m,b,o.fee,salaryFor(ovr(p),p.age,b.lg),R.i(2,4));
    G.offers=G.offers.filter(x=>x.pid!==p.id);save();render();
  },
  refuseOffer(d){G.offers.splice(+d.i,1);save();render()},
  goOffers(){G.tab='market';UI.mt='offers';render()},
  listP(d){const p=ME().squad.find(x=>x.id===+d.id);if(p){p.list=!p.list;addNews(p.list?`${p.name} est placé sur la liste des transferts.`:`${p.name} est retiré de la liste des transferts.`);save();render()}},
  release(d){
    const m=ME(),p=m.squad.find(x=>x.id===+d.id);if(!p)return;
    const cost=Math.round(p.sal*p.ctr*.5);
    if(m.squad.length<=28){addNews('Effectif minimum de 28 joueurs atteint.');return render()}
    if(!confirm(`Libérer ${p.name} ? Indemnité de rupture : ${fmtK(cost)} (50 % du salaire restant).`))return;
    m.budget-=cost;G.fin.transfers-=cost;removeFromClub(p,m);p.ctr=0;p.faT=0;p.list=false;G.fa.push(p);
    addNews(`${p.name} est libéré (${fmtK(cost)} d'indemnité).`);UI.modal=null;save();render();
  },
  mt(d){UI.mt=d.t;render()},
  flt(d,el){UI[d.k]=el.value;render()},
  setPot(d){G.settings=G.settings||{};G.settings.pot=d.v;try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(G.settings))}catch(err){}save();render()},
  nextSeason(){nextSeason();save();G.tab='home';render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;const f=ACT[b.dataset.a];if(f)f(b.dataset,b)});
document.addEventListener('change',e=>{const b=e.target;if(b.tagName==='SELECT'&&b.dataset.a){const f=ACT[b.dataset.a];if(f)f(b.dataset,b)}});
render();
</script>
</body>
</html>
